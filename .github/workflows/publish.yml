name: publish-app

# 無伺服器版：GitHub Actions 依排程計算，結果 (site/) 發布到 GitHub Pages；平板直接開 Pages 網址。
on:
  schedule:
    - cron: "*/10 1-5 * * 1-5"     # 台北 09:00~13:50 每 10 分鐘 (UTC+8)：盤中快照 (fast)；Pages 分支部署軟上限 10 次/小時
    - cron: "40 7 * * 1-5"         # 台北 15:40：盤後法人/期貨公布後 完整重算
    - cron: "*/30 9-14 * * 1-5"    # 台北 17:00~22:30 每 30 分鐘 (fast；Worker v10 會在八大行庫未到時加密成每 10 分鐘)：八大行庫 (HiStock 傍晚~晚間才更新) 一公布就帶上；fast 也會重抓八大行庫
    - cron: "45 13 * * 1-5"        # 台北 21:45：融資融券/借券公布後 完整重算
    - cron: "0 23 * * 0-4"         # 台北 07:00 (週一~五)：夜盤 05:00 收盤後 → 含夜盤模型才用完整夜盤 (fast)
    - cron: "40 21 * * 0-4"        # 台北 05:40 (週一~五)：美股收盤後 → 復市日開盤跳空加上休市期間美股 / 1 日帶中心移 (fast；GitHub 常延遲 1~3 小時)
    - cron: "0 22 * * 6"           # 週日 06:00：重訓模型 + 長歷史回測
  workflow_dispatch:
    inputs:
      mode:
        description: "fast | full | train | research (挖寶研究，不發布) | research_intraday (小時模型資料來源研究，不發布)"
        default: "full"

permissions:
  contents: write

concurrency:
  group: ${{ startsWith(github.event.inputs.mode, 'research') && 'research' || 'publish' }}   # 研究模式另排佇列，不擋盤中 5 分鐘發布
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Taipei
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      TREASURE_BACKFILL_DAYS: "95"   # 挖寶雲端帳本：缺的日期自動回填 (已掃過的日期跳過，平常零成本；某天排程失敗也會補)
      CHIP_WATCHLIST: ${{ vars.CHIP_WATCHLIST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: decide mode
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            case "${{ github.event.schedule }}" in
              "*/10 1-5 * * 1-5") MODE=fast ;;
              "*/30 9-14 * * 1-5") MODE=fast ;;
              "0 23 * * 0-4") MODE=fast ;;
              "40 21 * * 0-4") MODE=fast ;;
              "0 22 * * 6") MODE=train ;;
              *) MODE=full ;;
            esac
          fi
          echo "mode=$MODE" >> $GITHUB_OUTPUT
      - name: restore data cache (快取 / SQLite；模型不進 cache，一律以 git 版本為準)
        if: ${{ !startsWith(steps.mode.outputs.mode, 'research') }}
        uses: actions/cache@v4
        with:
          path: |
            data/cache
            data/chip.sqlite
          key: chip-data-${{ github.run_id }}
          restore-keys: chip-data-
      - name: restore data cache (research：只讀，不存回，免得較舊的快取蓋掉同時段發布的資料)
        if: ${{ startsWith(steps.mode.outputs.mode, 'research') }}
        uses: actions/cache/restore@v4
        with:
          path: |
            data/cache
            data/chip.sqlite
          key: chip-data-${{ github.run_id }}
          restore-keys: chip-data-
      - name: playwright (玩股網)
        if: ${{ steps.mode.outputs.mode != 'fast' && !startsWith(steps.mode.outputs.mode, 'research') }}
        run: python -m playwright install --with-deps chromium
      - name: research (挖寶 A 級：法人/營收特徵研究，結果上傳 artifact，不發布)
        if: steps.mode.outputs.mode == 'research'
        run: python tools/treasure_research.py
      - name: research_intraday (小時模型：TWSE 2016~ vs Yahoo 2 年 + 早盤模型，LightGBM 逐季 walk-forward；只上傳報告，不寫模型、不發布)
        if: steps.mode.outputs.mode == 'research_intraday'
        run: python tools/intraday_research.py
      - name: upload research
        if: ${{ startsWith(steps.mode.outputs.mode, 'research') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.mode.outputs.mode == 'research' && 'treasure-research' || 'intraday-research' }}
          path: research_out/
      - name: export
        if: ${{ !startsWith(steps.mode.outputs.mode, 'research') }}
        run: |
          case "${{ steps.mode.outputs.mode }}" in
            fast)  python tools/export_static.py --fast --no-wantgoo ;;
            train) python cli.py optimize && python cli.py global && python cli.py cross && python tools/export_static.py --train ;;
            *)     python tools/export_static.py ;;
          esac
      - name: commit retrained models (train 模式：把 data/models 與小時模型盤中歷史 data/intraday_marks.json 推回 main，之後每次排程都用新模型)
        if: steps.mode.outputs.mode == 'train'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/models data/intraday_marks.json
          git diff --cached --quiet || (git commit -m "weekly retrain: update models [skip ci]" && git push origin HEAD:main)
      - name: deploy to GitHub Pages
        if: ${{ !startsWith(steps.mode.outputs.mode, 'research') }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "publish ${{ steps.mode.outputs.mode }} ${{ github.run_id }}"
