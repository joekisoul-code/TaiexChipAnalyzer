name: publish-app

# 無伺服器版：GitHub Actions 依排程計算，結果 (site/) 發布到 GitHub Pages；平板直接開 Pages 網址。
on:
  schedule:
    - cron: "*/5 1-5 * * 1-5"      # 台北 09:00~13:59 每 5 分鐘 (UTC+8)：盤中快照 (fast)
    - cron: "40 7 * * 1-5"         # 台北 15:40：盤後法人/期貨公布後 完整重算
    - cron: "45 13 * * 1-5"        # 台北 21:45：融資融券/借券公布後 完整重算
    - cron: "0 22 * * 6"           # 週日 06:00：重訓模型 + 長歷史回測
  workflow_dispatch:
    inputs:
      mode:
        description: "fast | full | train | research (挖寶研究，不發布)"
        default: "full"

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Taipei
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      CHIP_WATCHLIST: ${{ vars.CHIP_WATCHLIST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: decide mode
        id: mode
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            case "${{ github.event.schedule }}" in
              "*/5 1-5 * * 1-5") MODE=fast ;;
              "0 22 * * 6") MODE=train ;;
              *) MODE=full ;;
            esac
          fi
          echo "mode=$MODE" >> $GITHUB_OUTPUT
      - name: restore data cache (快取 / SQLite；模型不進 cache，一律以 git 版本為準)
        uses: actions/cache@v4
        with:
          path: |
            data/cache
            data/chip.sqlite
          key: chip-data-${{ github.run_id }}
          restore-keys: chip-data-
      - name: playwright (玩股網)
        if: steps.mode.outputs.mode != 'fast' && steps.mode.outputs.mode != 'research'
        run: python -m playwright install --with-deps chromium
      - name: research (挖寶 A 級：法人/營收特徵研究，結果上傳 artifact，不發布)
        if: steps.mode.outputs.mode == 'research'
        run: python tools/treasure_research.py
      - name: upload research
        if: steps.mode.outputs.mode == 'research'
        uses: actions/upload-artifact@v4
        with:
          name: treasure-research
          path: research_out/
      - name: export
        if: steps.mode.outputs.mode != 'research'
        run: |
          case "${{ steps.mode.outputs.mode }}" in
            fast)  python tools/export_static.py --fast --no-wantgoo ;;
            train) python cli.py optimize && python cli.py global && python cli.py cross && python tools/export_static.py --train ;;
            *)     python tools/export_static.py ;;
          esac
      - name: commit retrained models (train 模式：把 data/models 推回 main，之後每次排程都用新模型)
        if: steps.mode.outputs.mode == 'train'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/models
          git diff --cached --quiet || (git commit -m "weekly retrain: update models [skip ci]" && git push origin HEAD:main)
      - name: deploy to GitHub Pages
        if: steps.mode.outputs.mode != 'research'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "publish ${{ steps.mode.outputs.mode }} ${{ github.run_id }}"
